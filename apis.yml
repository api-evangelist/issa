name: Issa
description: >-
  Issa Compass is a software platform that simplifies Thailand visa
  applications, operated by Issara Platforms Pte. Ltd. (Singapore) and Issa
  Systems Co, Ltd. (Bangkok). The platform helps users identify which Thai visa
  they qualify for and manages the end-to-end application process: a two-minute
  eligibility questionnaire, document verification and pre-qualification checks,
  real-time tracking of requirements against thousands of criteria, and a
  money-back guarantee if a pre-qualified application is rejected. Supported visa
  types include the Destination Thailand Visa (DTV), Long-Term Resident (LTR),
  Retirement, Spouse, and Student visas. Issa is a portfolio company of 500
  Global. There is no public developer API surface at this time.
